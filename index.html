<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>test123-AI Math Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <h1>🧮 AI MATH CALCULATOR</h1>

        <input type="text" id="display" class="display" placeholder="0" readonly>
        <div class="buttons">

            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('*')">×</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('-')">−</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="calculate()">=</button>
            <button onclick="appendValue('+')">+</button>

        </div>

        <button class="open-ai" onclick="openAI()">
            🤖 AI MATH SOLVER
        </button>

    </div>


    <!-- AI MODAL -->

    <div id="aiModal" class="ai-modal">

        <div class="ai-box">

            <div class="ai-header">
                <h2>🤖 AI MATH SOLVER</h2>

                <button class="close-button" onclick="closeAI()">
                    ✕
                </button>
            </div>


            <textarea id="aiQuestion" placeholder="اكتب المسألة الرياضية هنا..."></textarea>


            <button id="askAIButton" class="ask-button" onclick="askAI()">
                ASK AI
            </button>


            <!-- مكان النتيجة: موجود مرة واحدة فقط -->

            <div id="aiResult" class="ai-result"></div>

        </div>

    </div>
    <div class="creator-name">
        Made by<br>
        <strong>mohamed abdellhady</strong>
    </div>



    <script src="script.js"></script>

</body>

</html>
